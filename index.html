    #mission-screen::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 20%, rgba(2, 4, 8, .52) 100%); }
    #mission-screen::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .18; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.035) 4px 5px); mix-blend-mode: screen; }
    #mission-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .topbar, .bottomline { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 18px; position: relative; z-index: 1; }
    .brand-mark { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-emblem { width: 38px; height: 43px; border: 2px solid #ff8990; border-radius: 48% 48% 38% 38%; background: linear-gradient(135deg, #ff5d67 0%, #c92038 75%); box-shadow: 0 0 0 4px rgba(239,70,83,.13), 0 7px 22px rgba(0,0,0,.45); position: relative; flex: 0 0 auto; transform: rotate(-6deg); }
    .brand-emblem::after { content: ""; position: absolute; width: 22px; height: 11px; left: 5px; top: 8px; border: 2px solid #b9f8ff; border-radius: 7px 9px 6px 7px; transform: skewX(-12deg); background: linear-gradient(145deg, #d9ffff, #6da6c4 60%, #415e7f); box-shadow: 0 2px 0 rgba(0,0,0,.32); }
    .brand-title { display: block; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: clamp(21px, 3vw, 31px); font-weight: 900; letter-spacing: .105em; line-height: .95; text-shadow: 2px 3px 0 #751b2b, 0 4px 17px rgba(0,0,0,.45); }
    .brand-subtitle { display: block; margin-top: 7px; color: #c7ced9; font: 700 9px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .19em; }
    .top-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 9px; color: #d9e0e9; font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; text-align: right; }
    .signal-dot { display: inline-block; width: 7px; height: 7px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 11px rgba(112,232,237,.8); animation: blink 1.6s infinite; }
    .build-tag { border: 1px solid rgba(255,255,255,.22); border-radius: 3px; padding: 6px 8px; background: rgba(5,8,12,.34); color: #b4bfce; }
    .center-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; padding: 24px 0; }
    .launch-card, .loading-card { width: min(100%, 560px); border: 1px solid rgba(255,255,255,.17); border-top: 2px solid var(--red); border-radius: 9px; background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.035); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: clamp(23px, 4vw, 37px); position: relative; overflow: hidden; animation: card-in .5s cubic-bezier(.16,1,.3,1) both; }
    .launch-card::after, .loading-card::after { content: ""; position: absolute; width: 120px; height: 120px; right: -70px; top: -70px; border: 1px solid rgba(112,232,237,.25); transform: rotate(45deg); box-shadow: 0 0 0 12px rgba(112,232,237,.025), 0 0 0 25px rgba(112,232,237,.02); pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--cyan); font: 800 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .2em; }
    .eyebrow-mark { display: inline-block; width: 19px; height: 2px; background: var(--cyan); box-shadow: 0 0 9px rgba(112,232,237,.5); }
    h1 { margin: 18px 0 12px; font-size: clamp(27px, 4.2vw, 39px); letter-spacing: -.055em; line-height: 1.23; font-weight: 900; }
    h1 em { color: var(--red-hot); font-style: normal; text-shadow: 0 0 24px rgba(239,70,83,.2); }
    .lead { max-width: 440px; margin: 0; color: #c3cad5; font-size: 13px; line-height: 1.9; }
    .choice-list { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 26px; }
    .choice { width: 100%; min-width: 0; text-align: left; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 15px 15px 14px; background: rgba(255,255,255,.045); color: var(--text); cursor: pointer; transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease; font: inherit; }
    .choice:hover { transform: translateY(-2px); border-color: rgba(112,232,237,.65); background: rgba(112,232,237,.08); box-shadow: 0 8px 25px rgba(0,0,0,.2); }
    .choice:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .choice.primary { background: linear-gradient(135deg, #e84452, #b92237); border-color: #ff7580; box-shadow: 0 8px 24px rgba(186,30,51,.18), inset 0 1px rgba(255,255,255,.18); }
    .choice.primary:hover { border-color: #ffc4c8; background: linear-gradient(135deg, #fa5965, #ce2a40); }
    .choice:disabled { cursor: wait; opacity: .56; transform: none; }
    .choice-top { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 850; letter-spacing: .04em; }
    .choice-icon { width: 26px; height: 26px; border-radius: 5px; display: grid; place-items: center; flex: 0 0 auto; background: rgba(0,0,0,.2); font-size: 16px; }
    .choice small { display: block; margin-top: 9px; color: rgba(245,247,251,.72); font-size: 11px; line-height: 1.65; }
    .choice.primary small { color: rgba(255,255,255,.82); }
    .folder-hint { margin: 17px 0 0; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1); color: #929cad; font-size: 10px; line-height: 1.75; }
    .folder-hint code { color: #d5dce7; background: rgba(0,0,0,.28); padding: 2px 4px; border-radius: 3px; }
    .loading-card { display: none; width: min(100%, 500px); }
    .loading-heading { display: flex; gap: 16px; align-items: center; margin: 17px 0 8px; }
    .loader-orbit { width: 48px; height: 48px; border: 2px solid rgba(255,255,255,.12); border-top-color: var(--red-hot); border-right-color: var(--cyan); border-radius: 50%; position: relative; animation: spin 1.4s linear infinite; flex: 0 0 auto; }
    .loader-orbit::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; border: 2px solid rgba(239,70,83,.22); border-bottom-color: var(--red-hot); }
    .loading-heading h2 { margin: 0; font-size: clamp(19px, 3.5vw, 25px); letter-spacing: -.035em; }
    #unity-loading-status { color: #c4ccd8; font-size: 12px; line-height: 1.7; margin-top: 7px; overflow-wrap: anywhere; }
    .progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 26px; color: #aab5c5; font: 700 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; }
    #load-percent { color: var(--cyan); font-size: 13px; }
    #unity-progress-bar-empty { height: 7px; width: 100%; margin-top: 11px; border-radius: 99px; background: rgba(255,255,255,.11); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.35); }

          directory = await directory.getDirectoryHandle(pieces[i], { create: true });
        }
        var fileHandle = await directory.getFileHandle(pieces[pieces.length - 1], { create: true });
        var writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
      }

      async function downloadMissingLocalFiles(paths) {
        var failures = [];
        var nextIndex = 0;
        var completed = 0;
        var workerCount = Math.min(3, paths.length);
        async function worker() {
          while (true) {
            var index = nextIndex++;
            if (index >= paths.length) return;
            var path = paths[index];
            try {
              var response = await nativeFetch(new URL(path, location.href).href, { cache: "no-cache" });
              if (!response.ok) throw new Error("HTTP " + response.status);
              var blob = await response.blob();
              if (localRootHandle) {
                await writeLocalFile(path, blob);
              } else if (localFiles) {
                localFiles.set(normalizeLocalPath(path), blob);
              } else {
                throw new Error("保存先フォルダがありません。");
              }
              completed++;
              showLoadingProgress(0.02 + 0.28 * completed / paths.length, "ゲーム起動中");
            } catch (error) {
              failures.push(path + " (" + (error && error.message ? error.message : String(error)) + ")");
            }
          }
        }
        await Promise.all(Array.from({ length: workerCount }, worker));
        if (failures.length) {
          throw new Error("不足ファイルを取得できませんでした:\n" + failures.slice(0, 8).join("\n") + (failures.length > 8 ? "\nほか " + (failures.length - 8) + " 件" : ""));
        }
      }

      function rememberObjectUrl(blob) {
        var url = URL.createObjectURL(blob);
        objectUrlsToRevoke.push(url);
        return url;
      }

      async function localScriptUrl(path) {
        var file = await getLocalFile(path);
        // A predictable JavaScript MIME type avoids browser differences in File.type.
        return rememberObjectUrl(new Blob([file], { type: "text/javascript" }));
      }

      function recordDownloadedBytes(bytes) {
        if (loadingFailed) return;
        downloadedBytes += bytes;
        if (downloadProgressFrame !== null) return;
        downloadProgressFrame = requestAnimationFrame(() => {
          downloadProgressFrame = null;
          var progress = Math.min(downloadedBytes / downloadTotalBytes, 1);
          showLoadingProgress(progress * 0.85, (localMode ? "ローカルファイルを準備中… " : "ゲームデータをダウンロード中… ") + Math.floor(progress * 100) + "%");
        });
      }

      async function downloadBlob(url, mimeType) {
        if (localMode) return await getLocalBlob(url, mimeType);
        var response = await nativeFetch(url, { signal: preloadAbort.signal, cache: "no-cache" });
        if (!response.ok) throw new Error("Failed to load " + url + " (HTTP " + response.status + ")");
        if (!response.body || !response.body.getReader) {
          var buffer = await response.arrayBuffer();
          recordDownloadedBytes(buffer.byteLength);
          return new Blob([buffer], { type: mimeType });
        }
        var reader = response.body.getReader();
        var chunks = [];
        try {
          while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            chunks.push(chunk.value);
            recordDownloadedBytes(chunk.value.byteLength);
          }
        } finally {
          reader.releaseLock();
        }
        return new Blob(chunks, { type: mimeType });
      }

      async function combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth) {
        var responses = await Promise.all(Array.from({ length: partCount }, (_, index) => {
          var partNumber = String(index + 1).padStart(partNumberWidth || 0, "0");
          var partUrl = baseUrl + ".part" + partNumber;
          return downloadBlob(partUrl, mimeType);
        }));
        return new Blob(responses, { type: mimeType });
      }

      async function combineParts(baseUrl, partCount, mimeType, partNumberWidth) {
        var blob = await combinePartsToBlob(baseUrl, partCount, mimeType, partNumberWidth);
        return URL.createObjectURL(blob);
      }

      var splitBundles = {
  "defaultlocalgroup_assets__db69efd6d6015cdfb90e3e77a7544e5b.bundle": {
    partCount: 34,
    partNumberWidth: 2,
    blobPromise: null
  }
};

      function bundleBlob(baseUrl, splitBundle) {
        if (!splitBundle.blobPromise) {
          splitBundle.blobPromise = combinePartsToBlob(
            baseUrl, splitBundle.partCount, "application/octet-stream", splitBundle.partNumberWidth
          ).catch((error) => {
            splitBundle.blobPromise = null;
            throw error;
          });
        }
        return splitBundle.blobPromise;
      }

      function blobResponse(blob) {
        return new Response(blob, {
          status: 200,
          headers: { "Content-Type": blob.type, "Content-Length": String(blob.size) }
        });
      }

      async function preloadStreamingAssets() {
        var regularFiles = streamingAssetFiles.map(async (file) => {
          var url = new URL(file.url, location.href).href;
          var promise = downloadBlob(file.url, file.type);
          streamingAssetCache.set(url, promise);
          await promise;
        });
        var bundles = Object.keys(splitBundles).map((fileName) =>
          bundleBlob("StreamingAssets/aa/WebGL/" + fileName, splitBundles[fileName])
        );
        await Promise.all(regularFiles.concat(bundles));
      }

      function getStreamingAssetPath(url) {
        try {
          var pathname = new URL(url, location.href).pathname;
          var marker = "/StreamingAssets/";
          var index = pathname.indexOf(marker);
          if (index >= 0) return decodeURIComponent(pathname.slice(index + 1));
          if (pathname.startsWith("StreamingAssets/")) return decodeURIComponent(pathname);
        } catch (e) {}
        return null;
      }

      window.fetch = function(resource, options) {
        var requestUrl = typeof resource === "string" ? resource : resource instanceof URL ? resource.href : resource.url;
        var cleanUrl = requestUrl.split("?")[0].split("#")[0];
        var absoluteUrl;
        try { absoluteUrl = new URL(cleanUrl, location.href).href; } catch (e) { absoluteUrl = cleanUrl; }
        var cached = streamingAssetCache.get(absoluteUrl);
        if (cached) return cached.then(blobResponse);
        var fileName = cleanUrl.substring(cleanUrl.lastIndexOf("/") + 1);
        var splitBundle = splitBundles[fileName];
        if (splitBundle) return bundleBlob(cleanUrl, splitBundle).then(blobResponse);
        if (localMode) {
          var assetPath = getStreamingAssetPath(cleanUrl);
          if (assetPath) return getLocalBlob(assetPath, "application/octet-stream").then(blobResponse);
        }
        var rewritten = rewriteToServer(requestUrl, false);
        if (rewritten !== requestUrl) return nativeFetch(rewritten, options);
        return nativeFetch(resource, options);
      };

      async function beginLoading(useLocal) {
        if (gameStarted) return;
        gameStarted = true;
        localMode = Boolean(useLocal);
        launchOptions.style.display = "none";
        loadingBar.style.display = "block";
        loadError.hidden = true;
        returnStartButton.hidden = true;
        warningBanner.innerHTML = "";
        warningBanner.style.display = "none";
        progressBarFull.style.width = "0%";
        if (loadPercent) loadPercent.textContent = "0%";
        if (connectionChip) connectionChip.textContent = localMode ? "LOCAL CACHE SELECTED" : "NETWORK LOAD SELECTED";
        showLoadingProgress(0, localMode ? "ローカルフォルダからゲームデータを読み込んでいます…" : "配信元からゲームデータを読み込んでいます…");

        try {
          if (localMode) {
            config.frameworkUrl = await localScriptUrl("Build/AmongUsWeb.framework.js");
          } else {
            config.frameworkUrl = buildUrl + "/AmongUsWeb.framework.js";
          }
          var script = document.createElement("script");
          script.onerror = function() {
            loadingFailed = true;
            loadingStatus.textContent = "ローダーを読み込めませんでした。";
            loadError.hidden = false;
            loadError.textContent = localMode ? "選択したフォルダの AmongUsWeb.loader.js を読み込めませんでした。" : "ゲームローダーを配信元から読み込めませんでした。接続状況を確認してください。";
            returnStartButton.hidden = false;
            gameStarted = false;
          };
          script.src = localMode
            ? await localScriptUrl("Build/AmongUsWeb.loader.js")
            : loaderUrl;
          script.onload = async () => {
            try {
              var combinedUrls = await Promise.all([
                combineParts(buildUrl + "/AmongUsWeb.data", 6, "application/octet-stream"),
                combineParts(buildUrl + "/AmongUsWeb.wasm", 9, "application/wasm"),
                preloadStreamingAssets()
              ]);
              config.dataUrl = combinedUrls[0];
              config.codeUrl = combinedUrls[1];
              if (downloadProgressFrame !== null) {
                cancelAnimationFrame(downloadProgressFrame);
                downloadProgressFrame = null;
              }
              showLoadingProgress(0.85, "ゲームエンジンを起動しています…");
              await createUnityInstance(canvas, config, (progress) => {
                showLoadingProgress(0.85 + progress * 0.15, "ゲームエンジンを起動しています…");
              });
              canvas.style.visibility = "visible";
              loadingBar.style.display = "none";
              missionScreen.classList.add("is-hidden");
              setTimeout(function() { missionScreen.style.display = "none"; }, 600);
            } catch (error) {
              loadingFailed = true;
              preloadAbort.abort();
              if (downloadProgressFrame !== null) cancelAnimationFrame(downloadProgressFrame);
              loadingStatus.textContent = "ゲームを読み込めませんでした。";
              loadError.hidden = false;
              loadError.textContent = error && error.message ? error.message : String(error);
              returnStartButton.hidden = false;
              unityShowBanner(error && error.message ? error.message : String(error), "error");
              gameStarted = false;
            }
          };
          document.body.appendChild(script);
        } catch (error) {
          loadingStatus.textContent = "フォルダを確認できませんでした。";
          loadError.hidden = false;
          loadError.textContent = error && error.message ? error.message : String(error);
          returnStartButton.hidden = false;
          gameStarted = false;
        }
      }

      function showProgressPanel() {
        launchOptions.style.display = "none";
        loadingBar.style.display = "block";
        loadError.hidden = true;
        returnStartButton.hidden = true;
        progressBarFull.style.width = "0%";
        showLoadingProgress(0, "ゲーム起動中");
      }

      function showSetupError(error) {
        showProgressPanel();
        loadError.hidden = false;
        loadError.textContent = error && error.message ? error.message : String(error);
        returnStartButton.hidden = false;
      }

      async function chooseLocalFolder() {
        var localButton = document.querySelector("#choose-local");
        localButton.disabled = true;
        try {
          if (typeof window.showDirectoryPicker === "function") {
            localRootHandle = await window.showDirectoryPicker({ mode: "readwrite" });
            localFiles = null;
          } else if ("webkitdirectory" in localDirectoryInput) {
            localDirectoryInput.value = "";
            localDirectoryInput.click();
            return;
          } else {
            throw new Error("このブラウザではフォルダを選択できません。");
          }
          showProgressPanel();
          await validateLocalFolder();
          await saveStartupChoice("local");
          await beginLoading(true);
        } catch (error) {
          if (!(error && error.name === "AbortError")) showSetupError(error);
        } finally {
          localButton.disabled = false;
        }
      }

      document.querySelector("#choose-local").addEventListener("click", chooseLocalFolder);
      document.querySelector("#choose-network").addEventListener("click", async function() {
        await saveStartupChoice("network");
        await beginLoading(false);
      });
      localDirectoryInput.addEventListener("change", async function() {
        var selectedFiles = Array.from(localDirectoryInput.files || []);
        if (!selectedFiles.length) return;
        localFiles = new Map();
        localRootHandle = null;
        selectedFiles.forEach(function(file) {
          var relative = file.webkitRelativePath || file.name;
          var pieces = relative.split("/");
          if (pieces.length > 1) relative = pieces.slice(1).join("/");
          localFiles.set(normalizeLocalPath(relative), file);
        });
        try {
          showProgressPanel();
          await validateLocalFolder();
          await saveStartupChoice("local");
          await beginLoading(true);
        } catch (error) {
          showSetupError(error);
        }
      });

      async function autoLaunchRememberedChoice() {
        var mode = null;
        try { mode = localStorage.getItem("amongUsLaunchMode"); } catch (e) {}
        if (mode === "network") {
          await beginLoading(false);
          return;
        }
        if (mode !== "local") return;
        try {
          var handle = await loadDirectoryHandle();
          if (!handle) return;
          var permission = await handle.queryPermission({ mode: "readwrite" });
          if (permission !== "granted") return;
          localRootHandle = handle;
          localFiles = null;
          showProgressPanel();
          try {
            await validateLocalFolder();
            await beginLoading(true);
          } catch (error) {
            launchOptions.style.display = "none";
            loadingBar.style.display = "block";
            loadError.hidden = false;
            loadError.textContent = error && error.message ? error.message : String(error);
            returnStartButton.hidden = false;
          }
        } catch (e) {
          // If the saved folder is unavailable, leave the selection screen visible.
        }
      }

      returnStartButton.addEventListener("click", function() {
        try { localStorage.removeItem("amongUsLaunchMode"); } catch (e) {}
        location.reload();
      });

      autoLaunchRememberedChoice();

    
  </script>
</body>
</html>
